sonar.organization=musfirah828
sonar.projectKey=MUSFIRAH828_sqe-healthchecks
sonar.projectName=SQE Healthchecks (Checks module)
sonar.sourceEncoding=UTF-8

# Server-side code under test: the API app (models, views, decorators).
# Upstream tests and migrations are left out; they are not ours and are not business logic.
sonar.sources=hc/api
sonar.exclusions=hc/api/tests/**,hc/api/migrations/**

# Our own tests (they are not counted as source code)
sonar.tests=tests/team
sonar.test.inclusions=tests/team/**/test_*.py

sonar.python.version=3.12
# Written by: python -m coverage xml  (see .coveragerc)
sonar.python.coverage.reportPaths=coverage.xml
